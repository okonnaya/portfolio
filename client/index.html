<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- полное имя: заголовок уходит во вкладку, в выдачу поисковика и в
         закладку — «карина р.» там нечего ни найти, ни вбить в ats -->
    <title>карина рамазанова — продуктовый дизайнер</title>
    <meta
      name="description"
      content="портфолио продуктового дизайнера карины рамазановой: ии-решения в b2e, платформа для ai-ресёрчеров, продуктовые метрики и личные проекты."
    />

    <!-- превью для мессенджеров и соцсетей: без og-тегов ссылка на портфолио
         разворачивалась пустой карточкой с одним доменом. og.jpg собирается
         скриптом на каждой сборке (client/scripts/og-image.mjs) в 1200×630 —
         это то соотношение (1.91:1), которое телеграм, твиттер и слак
         показывают без обрезки. На карточке имя, роль и текущее место: раньше
         там был коллаж скриншотов кейса — в мелком превью он читался как
         «какой-то интерфейс», а заодно тащил в публичное поле ФИО и данные из
         рабочего проекта.
         ВАЖНО: когда появится домен, пропишите его в og:url и сделайте
         og:image абсолютным (https://домен/og.jpg) — часть скрейперов
         (в т.ч. фейсбук) относительные пути не разворачивает. -->
    <meta property="og:type" content="website" />
    <!-- имя в og — полное: карточку ссылки пересылают дальше, и «карина р.»
         в ней нечего вбить ни в поиск, ни в ats -->
    <meta property="og:site_name" content="карина рамазанова" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:title" content="карина рамазанова — продуктовый дизайнер" />
    <meta
      property="og:description"
      content="ии-решения в b2e, платформа для ai-ресёрчеров, продуктовые метрики и личные проекты."
    />
    <meta property="og:image" content="/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="карина рамазанова — продуктовый дизайнер"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Yandex.Metrika counter: грузим после первого рендера. Через VPN
         внешние аналитические домены часто отвечают медленно, а портфолио не
         должно ждать их перед показом контента. -->
    <script type="text/javascript">
      window.ym =
        window.ym ||
        function () {
          (window.ym.a = window.ym.a || []).push(arguments);
        };
      window.ym.l = 1 * new Date();

      ym(111828641, "init", {
        ssr: true,
        webvisor: true,
        clickmap: true,
        ecommerce: "dataLayer",
        referrer: document.referrer,
        url: location.href,
        accurateTrackBounce: true,
        trackLinks: true,
      });
    </script>
    <!-- /Yandex.Metrika counter -->

    <!-- Google Tag Manager: сам контейнер подключаем лениво, см. скрипт ниже. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
    </script>
    <!-- End Google Tag Manager -->
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript>
      <iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-5V7G6ZPX"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe>
    </noscript>
    <!-- End Google Tag Manager (noscript) -->

    <noscript>
      <div>
        <img
          src="https://mc.yandex.ru/watch/111828641"
          style="position: absolute; left: -9999px"
          alt=""
        />
      </div>
    </noscript>
    <div id="root"></div>
    <script>
      window.addEventListener("load", function () {
        window.setTimeout(function () {
          var metrika = document.createElement("script");
          metrika.async = true;
          metrika.src = "https://mc.yandex.ru/metrika/tag.js?id=111828641";
          document.head.appendChild(metrika);

          var gtm = document.createElement("script");
          gtm.async = true;
          gtm.src = "https://www.googletagmanager.com/gtm.js?id=GTM-5V7G6ZPX";
          document.head.appendChild(gtm);
        }, 1200);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
