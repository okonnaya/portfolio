name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Install SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure web roots
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "sudo mkdir -p /var/www/portfolio /var/www/portfolio-kinopoisk && sudo chown -R ${{ secrets.VPS_USER }}:${{ secrets.VPS_USER }} /var/www/portfolio /var/www/portfolio-kinopoisk"

      - name: Configure nginx
        run: |
          sed \
            -e 's#__PRIMARY_DOMAIN__#okonnaya.com#g' \
            -e 's#__KINOPOISK_DOMAIN__#kinopoisk.okonnaya.com#g' \
            -e 's#__WEB_ROOT__#/var/www/portfolio#g' \
            -e 's#__KINOPOISK_WEB_ROOT__#/var/www/portfolio-kinopoisk#g' \
            deploy/nginx.conf > /tmp/portfolio-nginx.conf
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            /tmp/portfolio-nginx.conf \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/portfolio-nginx.conf"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "sudo install -m 644 /tmp/portfolio-nginx.conf /etc/nginx/sites-available/portfolio && sudo ln -sf /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/portfolio && sudo rm -f /etc/nginx/sites-enabled/default && sudo nginx -t && sudo systemctl reload nginx"

      - name: Build main portfolio
        working-directory: client
        env:
          VITE_PORTFOLIO_VARIANT: main
          VITE_SITE_URL: https://okonnaya.com
        run: npm run build

      - name: Upload main portfolio
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            client/dist/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/portfolio/"

      - name: Build Kinopoisk portfolio
        working-directory: client
        env:
          VITE_PORTFOLIO_VARIANT: kinopoisk
          VITE_SITE_URL: https://kinopoisk.okonnaya.com
        run: npm run build

      - name: Upload Kinopoisk portfolio
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            client/dist/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/portfolio-kinopoisk/"
