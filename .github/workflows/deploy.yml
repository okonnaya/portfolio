name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Install SSH key
        env:
          DEPLOY_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Build main portfolio
        working-directory: client
        env:
          VITE_PORTFOLIO_VARIANT: main
          VITE_SITE_URL: https://okonnaya.com
        run: npm run build

      - name: Upload main portfolio
        run: |
          rsync -az --delete --exclude=.well-known/ \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            client/dist/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/portfolio/"

      - name: Build Kinopoisk portfolio
        working-directory: client
        env:
          VITE_PORTFOLIO_VARIANT: kinopoisk
          VITE_SITE_URL: https://kinopoisk.okonnaya.com
        run: npm run build

      - name: Upload Kinopoisk portfolio
        run: |
          rsync -az --delete --exclude=.well-known/ \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            client/dist/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/portfolio-kinopoisk/"

      - name: Update server source checkout
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            "git -C /var/www/portfolio-src fetch origin main && git -C /var/www/portfolio-src reset --hard $GITHUB_SHA"

      - name: Check deployed pages
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          curl --fail --silent --show-error --resolve "okonnaya.com:80:$VPS_HOST" http://okonnaya.com/ -o /dev/null
          curl --fail --silent --show-error --resolve "kinopoisk.okonnaya.com:80:$VPS_HOST" http://kinopoisk.okonnaya.com/ -o /dev/null
