# Шаблон сайта nginx для портфолио.
# Скопируй на сервер и подставь свой домен:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/portfolio
#   sudo ln -sf /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/portfolio
#   sudo nginx -t && sudo systemctl reload nginx

# Для поддомена kinopoisk корень должен сразу отдавать prerender спецстраницы.
# map лежит в http-контексте: sites-enabled обычно подключается именно туда.
map $host $portfolio_root_index {
    default /index.html;
    ~^kinopoisk\. /kinopoisk/index.html;
}

server {
    listen 80;
    listen [::]:80;

    # Замени на свой домен или IP
    server_name portfolio.example.com kinopoisk.portfolio.example.com;

    root /var/www/portfolio;
    index index.html;

    # Видео и крупные ассеты — без буферизации в память nginx
    sendfile on;
    tcp_nopush on;

    # Сжатие текстовых форматов
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Хэшированные ассеты Vite — долгий кэш
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Картинки, видео, шрифты и PDF из public после сборки лежат в корне
    # (/case4_1.png, /motion.webm, /fonts/...). Через VPN повторные проверки
    # таких файлов особенно заметны, поэтому даём им долгий браузерный кэш.
    location ~* \.(?:avif|webp|png|jpe?g|gif|svg|ico|webm|mp4|woff2?|pdf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML должен проверяться при каждом заходе, иначе после деплоя пользователь
    # может остаться на старой версии приложения.
    location = / {
        try_files $portfolio_root_index =404;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # SPA: React Router (/cv, /case/:slug и т.д.)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Базовые заголовки
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
