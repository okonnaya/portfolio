# Шаблон сайта nginx для портфолио.
# Скопируй на сервер и подставь свой домен:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/portfolio
#   sudo ln -sf /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/portfolio
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;

    # Замени на свой домен или IP
    server_name portfolio.example.com;

    root /var/www/portfolio;
    index index.html;

    # Видео и крупные ассеты — без буферизации в память nginx
    sendfile on;
    tcp_nopush on;

    # Сжатие текстовых форматов
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Хэшированные ассеты Vite — долгий кэш
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: React Router (/cv, /case/:slug и т.д.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Базовые заголовки
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
